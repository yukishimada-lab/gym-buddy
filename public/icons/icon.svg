<!--
  gym-buddy のアプリアイコン(デザインの元データ)。
  実際に配信する PNG は scripts/generate-icons.mjs がこれと同じ形状を描いて生成します。
  形を変えたいときは、この SVG と scripts/generate-icons.mjs の DUMBBELL を両方直してください。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="gym-buddy">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="115.2" ry="115.2" fill="url(#g)"/>
  <g fill="#ffffff" transform="rotate(-30 256 256)">
    <!-- シャフト -->
    <rect x="192.51" y="234.58" width="126.98" height="42.85" rx="21.27" ry="21.27"/>
    <!-- 内側のプレート -->
    <rect x="148.07" y="182.99" width="47.62" height="146.02" rx="22.22" ry="22.22"/>
    <rect x="316.31" y="182.99" width="47.62" height="146.02" rx="22.22" ry="22.22"/>
    <!-- 外側のカラー -->
    <rect x="107.60" y="211.56" width="33.33" height="88.88" rx="16.51" ry="16.51"/>
    <rect x="371.07" y="211.56" width="33.33" height="88.88" rx="16.51" ry="16.51"/>
  </g>
</svg>
