<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>オフラインです | gym-buddy</title>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /*
        Service Worker がオフライン時に出す差し替えページ。
        Next.js のバンドルに依存させたくないので、素の HTML/CSS で完結させている。
      */
      :root {
        --background: #f4f5f7;
        --foreground: #1a1d21;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
          calc(24px + env(safe-area-inset-left));
        background: var(--background);
        color: var(--foreground);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      p {
        margin: 0;
        max-width: 20rem;
        font-size: 14px;
        line-height: 1.7;
        color: #4b5563;
      }
      button {
        margin-top: 4px;
        border: 0;
        border-radius: 12px;
        background: #2563eb;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        padding: 12px 28px;
      }
      button:active {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>オフラインです</h1>
    <p>
      インターネットに接続されていないため、記録の読み込みや保存ができません。
      電波の届く場所で、もう一度お試しください。
    </p>
    <button type="button" onclick="location.reload()">再読み込み</button>
  </body>
</html>
